server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para os microsserviços: a SPA fala sempre com a própria
    # origem (localhost:4200), então não existe requisição cross-origin e
    # nenhum backend precisa emitir cabeçalhos CORS. A barra final no
    # proxy_pass remove o prefixo antes de repassar, de modo que
    # /api/estoque/produtos chega no serviço como /produtos.
    location /api/estoque/ {
        proxy_pass http://estoque:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A interpretação por IA pode ser mais lenta que uma chamada interna.
        proxy_read_timeout 60s;
    }

    location /api/faturamento/ {
        proxy_pass http://faturamento:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
