<div class="nota-lista">
  <header class="nota-lista__cabecalho">
    <h1>Notas fiscais</h1>
    <a mat-flat-button color="primary" routerLink="/notas/nova">
      <mat-icon>add</mat-icon>
      Nova nota
    </a>
  </header>

  @if (carregando()) {
    <div class="nota-lista__carregando">
      <mat-spinner diameter="32" />
    </div>
  } @else {
    <table mat-table [dataSource]="notas()" class="mat-elevation-z1">
      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let nota">{{ nota.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let nota">
          <mat-chip [class.nota-lista__chip--aberta]="nota.status === 'Aberta'"
                    [class.nota-lista__chip--fechada]="nota.status === 'Fechada'">
            {{ nota.status }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="fechadoEm">
        <th mat-header-cell *matHeaderCellDef>Fechada em</th>
        <td mat-cell *matCellDef="let nota">{{ nota.fechadoEm ? (nota.fechadoEm | date: 'dd/MM/yyyy HH:mm') : '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let nota">
          <a mat-button [routerLink]="['/notas', nota.id]">Ver detalhe</a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunas"></tr>
      <tr mat-row *matRowDef="let row; columns: colunas"></tr>
    </table>

    @if (notas().length === 0) {
      <p class="nota-lista__vazio">Nenhuma nota cadastrada.</p>
    }
  }
</div>
